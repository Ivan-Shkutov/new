name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check pulse_app/static/app.js
      - run: node --check pulse_app/static/scenarios.js
      - name: Evaluate dashboard PromQL with pinned Prometheus
        run: |
          docker pull prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
          python scripts/promql-smoke.py --docker-image prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
      - name: Browser incident workflow
        run: |
          python -m playwright install --with-deps chromium
          ./pulse --runtime /tmp/pulse-browser-ci init --port 18162
          PULSE_RUNTIME=/tmp/pulse-browser-ci python -m uvicorn pulse_app.app:app --host 127.0.0.1 --port 18162 >/tmp/pulse-browser-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18162/healthz && break || sleep 1; done
          python scripts/investigator-ui-smoke.py --runtime /tmp/pulse-browser-ci --screenshots /tmp/pulse-browser-shots
      - run: PULSE_RUNTIME_HOST=/tmp/pulse-ci docker compose -f deploy/compose.ai.yaml config --quiet
      - run: docker compose config --quiet
      - run: docker compose -f deploy/compose.knowledge.yaml config --quiet
      - run: PULSE_RUNTIME_HOST=/tmp/pulse-ci docker compose -f deploy/compose.https.yaml config --quiet
      - run: docker build -t pulse-clusters:test .
