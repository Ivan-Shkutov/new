# Combine with the generated per-cluster Holmes compose; see docs/AI-STACK-RU.md.
# All published APIs bind loopback. No GPU devices are requested by this stack.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.5@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    restart: unless-stopped
    ports: ["127.0.0.1:16333:6333"]
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: ["${PULSE_QDRANT_DATA:-/opt/services/qdrant/storage}:/qdrant/storage"]
    mem_limit: ${QDRANT_MEMORY:-4g}
    cpus: ${QDRANT_CPUS:-2}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  embeddings:
    image: ollama/ollama:0.13.5@sha256:6f5589597ef2cd6abb94cd34221ef46a880a4c5393973a646979e7804eb8b573
    restart: unless-stopped
    ports: ["127.0.0.1:11435:11434"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: ["${PULSE_EMBEDDING_DATA:-/opt/services/rag/embedding-models}:/root/.ollama"]
    mem_limit: ${EMBEDDINGS_MEMORY:-8g}
    cpus: ${EMBEDDINGS_CPUS:-4}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  indexer:
    image: pulse-clusters:0.16.0
    profiles: [library]
    network_mode: host
    user: "${PULSE_UID:-65532}:${PULSE_GID:-65532}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m,mode=1777]
    volumes:
      - ${PULSE_LIBRARY_INBOX:-/opt/services/rag/inbox}:/library/inbox:ro
      - ${PULSE_RUNTIME_HOST:?Set PULSE_RUNTIME_HOST}/library-reports:/library/reports
      - ${PULSE_RUNTIME_HOST}/secrets/portal-password:/run/secrets/portal-password:ro
    command: [python, -m, pulse_app.library, --watch, --path, /library/inbox, --base-url, "http://127.0.0.1:${PULSE_PORT:-8090}", --username, "${PULSE_USERNAME:-pulse}"]
